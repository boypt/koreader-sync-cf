name = "koreader-sync-worker"
main = "./src/index.js"
compatibility_date = "2026-02-26"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[[d1_databases]]
binding = "KOSYNC_DB"
database_name = "kosync"
migrations_dir = "migrations"
